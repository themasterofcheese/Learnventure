<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learnventure — Hex Map Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080c14; font-family: 'Outfit', sans-serif; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-bottom: 1px solid #334155; flex-shrink: 0; }
  header h1 { font-size: 17px; font-weight: 800; color: #f8fafc; }
  header p  { font-size: 11px; color: #64748b; }
  .header-btns { margin-left: auto; display: flex; gap: 8px; }
  .btn { padding: 7px 15px; border-radius: 8px; border: none; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn-ghost   { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
  .btn-ghost:hover { background: #334155; }
  .btn-success { background: #22c55e; color: white; }
  .btn-success:hover { background: #16a34a; }
  .main { display: flex; flex: 1; overflow: hidden; }

  .palette { width: 205px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .pal-search { padding: 9px; border-bottom: 1px solid #1e293b; }
  .pal-search input { width: 100%; padding: 6px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-family: 'Outfit', sans-serif; font-size: 12px; outline: none; }
  .pal-body { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .grp-title { font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.8px; text-transform: uppercase; padding: 2px 4px; }
  .grp { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .tile-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px; border-radius: 8px; border: 2px solid transparent; background: #1e293b; cursor: pointer; transition: all 0.13s; }
  .tile-btn:hover { background: #293548; border-color: #475569; }
  .tile-btn.active { border-color: #3b82f6; background: #172554; }
  .tile-btn canvas { display: block; border-radius: 4px; }
  .tile-btn span { font-size: 9px; color: #94a3b8; text-align: center; line-height: 1.2; }
  .tile-btn.active span { color: #93c5fd; }
  .eraser-btn { grid-column: span 2; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; padding: 8px; border-radius: 8px; border: 2px solid transparent; background: #1e293b; cursor: pointer; transition: all 0.13s; }
  .eraser-btn:hover { border-color: #7f1d1d; background: #2e1a1a; }
  .eraser-btn.active { border-color: #ef4444; background: #2e1a1a; }
  .erase-ico { width: 32px; height: 32px; background: #ef4444; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .eraser-btn span { font-size: 12px; color: #fca5a5; font-weight: 600; }

  .canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  canvas#mc { display: block; cursor: crosshair; }

  .hud { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; background: rgba(6,9,16,0.9); border: 1px solid #334155; border-radius: 12px; padding: 7px 16px; backdrop-filter: blur(10px); white-space: nowrap; }
  .hud-item { font-size: 11px; color: #64748b; }
  .hud-item strong { color: #e2e8f0; font-weight: 600; }
  .zc { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
  .zb { width: 30px; height: 30px; border-radius: 7px; border: 1px solid #334155; background: rgba(15,23,42,0.92); color: #e2e8f0; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.13s; }
  .zb:hover { background: #1e293b; }
  .keys { position: absolute; top: 12px; left: 12px; background: rgba(6,9,16,0.85); border: 1px solid #1e293b; border-radius: 8px; padding: 8px 12px; font-size: 10px; color: #475569; line-height: 1.9; pointer-events: none; }
  .keys strong { color: #64748b; }
  #toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%) translateY(14px); background: #22c55e; color: white; padding: 9px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; pointer-events: none; opacity: 0; transition: all 0.28s; z-index: 999; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div><h1>🗺️ Learnventure — Hex Map Editor</h1><p>Select a tile · click/drag to paint · right-click drag to pan · scroll to zoom</p></div>
  <div class="header-btns">
    <button class="btn btn-ghost" id="b-undo">↩ Undo</button>
    <button class="btn btn-ghost" id="b-clear">🗑 Clear</button>
    <button class="btn btn-ghost" id="b-load">📂 Load</button>
    <button class="btn btn-success" id="b-save">💾 Save</button>
    <input type="file" id="fi" accept=".json" style="display:none">
  </div>
</header>
<div class="main">
  <div class="palette">
    <div class="pal-search"><input id="srch" type="text" placeholder="🔍 Filter…"></div>
    <div class="pal-body" id="pal"></div>
  </div>
  <div class="canvas-wrap" id="cw">
    <canvas id="mc"></canvas>
    <div class="keys"><strong>E</strong> Eraser · <strong>Ctrl+Z</strong> Undo<br><strong>Right drag</strong> Pan · <strong>Scroll</strong> Zoom</div>
    <div class="zc">
      <button class="zb" id="zi">+</button>
      <button class="zb" id="zo">−</button>
      <button class="zb" id="zr" style="font-size:11px">⌖</button>
    </div>
    <div class="hud">
      <div class="hud-item">Brush: <strong id="h-tile">Deep Ocean</strong></div>
      <div class="hud-item">Grid: <strong id="h-coord">—</strong></div>
      <div class="hud-item">Cells: <strong id="h-count">0</strong></div>
      <div class="hud-item">Zoom: <strong id="h-zoom">90%</strong></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  TILE REGISTRY
// ══════════════════════════════════════════════════
const TILES = {
  hex_water_deep:    { label:'Deep Ocean',    group:'🌊 Water',           src:'assets/hex/hex_water_deep.jpg',    fb:['#0a2d5e','#051830'] },
  hex_water_shallow: { label:'Shallow Coast', group:'🌊 Water',           src:'assets/hex/hex_water_shallow.jpg', fb:['#1066a0','#084060'] },
  hex_cliff_rock:    { label:'Granite Cliff', group:'🪨 Coastal Cliff',    src:'assets/hex/hex_cliff_rock.jpg',    fb:['#363e4a','#1a2030'] },
  hex_cliff_coastal: { label:'Stone Edge',    group:'🪨 Coastal Cliff',    src:'assets/hex/hex_cliff_coastal.jpg', fb:['#7a6650','#4a3c2a'] },
  hex_math_slate:    { label:'Slate Stone',   group:'📐 Math Realm',       src:'assets/hex/hex_math_slate.jpg',    fb:['#2e4268','#162038'] },
  hex_math_crystal:  { label:'Cyan Quartz',   group:'📐 Math Realm',       src:'assets/hex/hex_math_crystal.jpg',  fb:['#1a3060','#0a1030'] },
  hex_math_cobble:   { label:'Cobblestone',   group:'📐 Math Realm',       src:'assets/hex/hex_math_cobble.jpg',   fb:['#3a4870','#1a2848'] },
  hex_chem_basalt:   { label:'Basalt',         group:'🧪 Chemistry Realm',  src:'assets/hex/hex_chem_basalt.jpg',   fb:['#2a2a30','#111116'] },
  hex_chem_ember:    { label:'Ember Rock',    group:'🧪 Chemistry Realm',  src:'assets/hex/hex_chem_ember.jpg',    fb:['#1e0e08','#0c0400'] },
  hex_chem_olive:    { label:'Olive Rock',    group:'🧪 Chemistry Realm',  src:'assets/hex/hex_chem_olive.jpg',    fb:['#2e3a18','#141c08'] },
  hex_bio_moss:      { label:'Forest Moss',   group:'🌿 Biology Realm',    src:'assets/hex/hex_bio_moss.jpg',      fb:['#2a5018','#102408'] },
  hex_bio_spore:     { label:'Spore Stone',   group:'🌿 Biology Realm',    src:'assets/hex/hex_bio_spore.jpg',     fb:['#143018','#060e08'] },
  hex_bio_timber:    { label:'Timber',         group:'🌿 Biology Realm',    src:'assets/hex/hex_bio_timber.jpg',    fb:['#3a2010','#180a04'] },
  hex_phys_steel:    { label:'Steel Plate',   group:'⚡ Physics Realm',    src:'assets/hex/hex_phys_steel.jpg',    fb:['#2a3848','#101820'] },
  hex_phys_circuit:  { label:'Circuit',        group:'⚡ Physics Realm',    src:'assets/hex/hex_phys_circuit.jpg',  fb:['#20183a','#0a0818'] },
  hex_phys_obsidian: { label:'Obsidian',       group:'⚡ Physics Realm',    src:'assets/hex/hex_phys_obsidian.jpg', fb:['#181820','#06060c'] },
  hex_shop_plaza:    { label:'Limestone',      group:'🏪 Shop Area',        src:'assets/hex/hex_shop_plaza.jpg',    fb:['#d4a84a','#8a6820'] },
  hex_shop_timber:   { label:'Oak Wood',       group:'🏪 Shop Area',        src:'assets/hex/hex_shop_timber.jpg',   fb:['#7a4820','#3c200a'] },
  hex_shop_brick:    { label:'Terracotta',     group:'🏪 Shop Area',        src:'assets/hex/hex_shop_brick.jpg',    fb:['#b04030','#701c10'] },
  hex_shop_marble:   { label:'Gold Marble',   group:'🏪 Shop Area',        src:'assets/hex/hex_shop_marble.jpg',   fb:['#dccfb2','#a89070'] },
};
const GROUPS = [...new Set(Object.values(TILES).map(t => t.group))];

// ══════════════════════════════════════════════════
//  HEX GEOMETRY  — pointy-top staggered rows
//  For pointy-top: vertices at 30+60*i degrees
//  dx = sqrt(3)*R   dy = 1.5*R
//  Odd rows shift right by dx/2
// ══════════════════════════════════════════════════
const BASE_R = 52;
const SQ3 = Math.sqrt(3);

function cellCentre(c, r, px, py, z) {
  const R = BASE_R * z;
  return { sx: c * SQ3 * R + (r & 1) * SQ3 * R / 2 + px,
           sy: r * 1.5 * R + py };
}

function buildHexPath(ctx, sx, sy, R) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i + Math.PI / 6;
    i === 0 ? ctx.moveTo(sx + R * Math.cos(a), sy + R * Math.sin(a))
            : ctx.lineTo(sx + R * Math.cos(a), sy + R * Math.sin(a));
  }
  ctx.closePath();
}

function nearestCell(px, py, panX, panY, zoom) {
  const R = BASE_R * zoom;
  const ar = Math.round((py - panY) / (1.5 * R));
  const ac = Math.round((px - panX - (ar & 1) * SQ3 * R / 2) / (SQ3 * R));
  let best = Infinity, bc = ac, br = ar;
  for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
    const c = ac + dc, r = ar + dr;
    const { sx, sy } = cellCentre(c, r, panX, panY, zoom);
    const d = Math.hypot(px - sx, py - sy);
    if (d < best) { best = d; bc = c; br = r; }
  }
  return { col: bc, row: br };
}

// ══════════════════════════════════════════════════
//  TILE RENDERING
//
//  Our tiles are AI-generated 1024×1024 isometric 3D hex block renders.
//  The top face (the actual texture) lives in approximately the top 8-53% 
//  of the image height.  The 3D depth sides occupy the remaining 47-100%.
//
//  To show ONLY the top face in the hex polygon:
//    ih = 2R / (0.53 - 0.08) = 4.44R   (scale so top face = 2R = hex height)
//    iy = sy - R - 0.08 * ih = sy - 1.355R
//
//  The hex clip polygon removes everything outside the hex boundary —
//  so the top-face texture fills the hex cleanly, no white BG visible.
// ══════════════════════════════════════════════════
function drawTile(ctx, sx, sy, R, tid) {
  const t   = TILES[tid];
  const img = tileImgs[tid];

  // ── 1. Fallback gradient base (visible if image not loaded yet) ──
  buildHexPath(ctx, sx, sy, R);
  const bg = ctx.createRadialGradient(sx, sy - R * 0.2, R * 0.05, sx, sy + R * 0.3, R * 1.1);
  bg.addColorStop(0, t.fb[0]); bg.addColorStop(1, t.fb[1]);
  ctx.fillStyle = bg; ctx.fill();

  // ── 2. Image overlay (clipped to hex, scaled to show top face only) ──
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    buildHexPath(ctx, sx, sy, R);
    ctx.clip();

    // Scale factor: ih = 4.44 * R (top-face occupies ~45% of image height)
    // Vertical offset: position so top face aligns with hex top (-R) to bottom (+R)
    //   iy = sy - R - 0.08 * ih  →  iy = sy - ih * 0.305  (where ih = 4.44R)
    const ih = R * 4.44;
    ctx.drawImage(img, sx - ih * 0.5, sy - ih * 0.305, ih, ih);

    ctx.restore();
  }

  // ── 3. Edge vignette for depth/definition ──
  ctx.save();
  buildHexPath(ctx, sx, sy, R);
  ctx.clip();
  const vg = ctx.createRadialGradient(sx, sy, R * 0.3, sx, sy, R * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = vg; ctx.fill();
  ctx.restore();

  // ── 4. Hex border ──
  buildHexPath(ctx, sx, sy, R);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = Math.max(0.6, R * 0.042);
  ctx.stroke();
}

// ══════════════════════════════════════════════════
//  IMAGE PRELOAD + PALETTE SWATCHES
// ══════════════════════════════════════════════════
const tileImgs   = {};
const swatchCvs  = {};
let   loadedN = 0, totalN = 0;

function makeSwatchCanvas(tid) {
  const cvs = document.createElement('canvas');
  cvs.width = 72; cvs.height = 64;
  const pc = cvs.getContext('2d');
  const W = 72, H = 64, cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 - 2;

  // Build hex clip
  pc.save();
  pc.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i + Math.PI / 6;
    i === 0 ? pc.moveTo(cx + R * Math.cos(a), cy + R * Math.sin(a))
            : pc.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
  }
  pc.closePath();
  pc.clip();

  const img = tileImgs[tid];
  const t   = TILES[tid];
  if (img && img.complete && img.naturalWidth > 0) {
    // Same scale formula as main map rendering
    const ih = R * 4.44;
    pc.drawImage(img, cx - ih * 0.5, cy - ih * 0.305, ih, ih);
  } else {
    // Fallback gradient
    const g = pc.createRadialGradient(cx, cy - R * 0.2, 0, cx, cy + R * 0.3, R * 1.1);
    g.addColorStop(0, t.fb[0]); g.addColorStop(1, t.fb[1]);
    pc.fillStyle = g; pc.fill();
  }

  // Vignette
  const vg = pc.createRadialGradient(cx, cy, R * 0.3, cx, cy, R * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  pc.fillStyle = vg; pc.fill();
  pc.restore();

  // Border
  pc.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i + Math.PI / 6;
    i === 0 ? pc.moveTo(cx + R * Math.cos(a), cy + R * Math.sin(a))
            : pc.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
  }
  pc.closePath();
  pc.strokeStyle = 'rgba(0,0,0,0.6)'; pc.lineWidth = 1.5; pc.stroke();

  return cvs;
}

function refreshSwatch(tid) {
  const cvs = makeSwatchCanvas(tid);
  swatchCvs[tid] = cvs;
  const holder = document.getElementById('sw-' + tid);
  if (holder) { holder.innerHTML = ''; holder.appendChild(cvs); }
}

function preload() {
  totalN = Object.keys(TILES).length;
  for (const [id, t] of Object.entries(TILES)) {
    const img = new Image();
    img.onload = img.onerror = () => { loadedN++; refreshSwatch(id); render(); };
    img.src = t.src;
    tileImgs[id] = img;
  }
}

// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
const COLS = 48, ROWS = 34;
let zoom = 0.9, panX = 120, panY = 60;
let selTile = 'hex_water_deep', selLabel = 'Deep Ocean';
let isPaint = false, isPan = false, panSt = { x: 0, y: 0 };
const undoStack = [], grid = new Map();

// ══════════════════════════════════════════════════
//  CANVAS + RENDER
// ══════════════════════════════════════════════════
const cw  = document.getElementById('cw');
const can = document.getElementById('mc');
const ctx = can.getContext('2d');

function resize() { can.width = cw.clientWidth; can.height = cw.clientHeight; render(); }
window.addEventListener('resize', resize);

function render() {
  ctx.clearRect(0, 0, can.width, can.height);
  ctx.fillStyle = '#04060e'; ctx.fillRect(0, 0, can.width, can.height);

  const R = BASE_R * zoom;

  // Faint grid dots for empty cells
  ctx.fillStyle = 'rgba(255,255,255,0.025)';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const { sx, sy } = cellCentre(c, r, panX, panY, zoom);
    if (sx < -R * 2 || sx > can.width + R * 2 || sy < -R * 2 || sy > can.height + R * 2) continue;
    ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI * 2); ctx.fill();
  }

  // Draw tiles row by row (top to bottom for correct overlap)
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const tid = grid.get(`${c},${r}`); if (!tid) continue;
    const { sx, sy } = cellCentre(c, r, panX, panY, zoom);
    if (sx + R * 3 < 0 || sx - R * 3 > can.width || sy + R * 3 < 0 || sy - R * 3 > can.height) continue;
    drawTile(ctx, sx, sy, R, tid);
  }

  // Loading banner
  if (loadedN < totalN) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, can.width, can.height);
    ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 15px Outfit'; ctx.textAlign = 'center';
    ctx.fillText(`Loading tiles… ${loadedN} / ${totalN}`, can.width / 2, can.height / 2);
    ctx.textAlign = 'left';
  }
}

// ══════════════════════════════════════════════════
//  PAINTING
// ══════════════════════════════════════════════════
function canvasXY(e) {
  const rc = can.getBoundingClientRect(), s = e.touches ? e.touches[0] : e;
  return { px: s.clientX - rc.left, py: s.clientY - rc.top };
}

function paint(e) {
  if (!isPaint) return;
  const { px, py } = canvasXY(e);
  const { col, row } = nearestCell(px, py, panX, panY, zoom);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  const key = `${col},${row}`, prev = grid.get(key);
  if (selTile === '__erase__') {
    if (prev !== undefined) { undoStack.push({ key, prev, next: null }); grid.delete(key); updateHUD(col, row); render(); }
  } else if (prev !== selTile) {
    undoStack.push({ key, prev: prev || null, next: selTile }); grid.set(key, selTile); updateHUD(col, row); render();
  }
}

function updateHUD(col, row) {
  document.getElementById('h-coord').textContent = `${col},${row}`;
  document.getElementById('h-count').textContent = grid.size;
}

// ── Input events ──
can.addEventListener('mousedown', e => {
  if (e.button === 2 || e.button === 1) {
    isPan = true; panSt = { x: e.clientX - panX, y: e.clientY - panY };
    can.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  isPaint = true; paint(e);
});
can.addEventListener('mousemove', e => {
  if (isPan) { panX = e.clientX - panSt.x; panY = e.clientY - panSt.y; render(); return; }
  if (isPaint) { paint(e); return; }
  const rc = can.getBoundingClientRect();
  const { col, row } = nearestCell(e.clientX - rc.left, e.clientY - rc.top, panX, panY, zoom);
  document.getElementById('h-coord').textContent = `${col},${row}`;
});
can.addEventListener('mouseup',    () => { isPaint = false; isPan = false; can.style.cursor = 'crosshair'; });
can.addEventListener('mouseleave', () => { isPaint = false; isPan = false; can.style.cursor = 'crosshair'; });
can.addEventListener('contextmenu', e => e.preventDefault());
can.addEventListener('wheel', e => {
  e.preventDefault();
  const rc = can.getBoundingClientRect(), mx = e.clientX - rc.left, my = e.clientY - rc.top;
  const d = e.deltaY > 0 ? 0.88 : 1.14, nz = Math.max(0.15, Math.min(6, zoom * d));
  panX = mx - (mx - panX) * (nz / zoom); panY = my - (my - panY) * (nz / zoom); zoom = nz;
  document.getElementById('h-zoom').textContent = Math.round(zoom * 100) + '%'; render();
}, { passive: false });
can.addEventListener('touchstart', e => { isPaint = true; paint(e); e.preventDefault(); }, { passive: false });
can.addEventListener('touchmove',  e => { paint(e); e.preventDefault(); }, { passive: false });
can.addEventListener('touchend',   () => { isPaint = false; });

// ══════════════════════════════════════════════════
//  PALETTE UI
// ══════════════════════════════════════════════════
function buildPalette(filter = '') {
  const pal = document.getElementById('pal');
  pal.innerHTML = '';
  const fl = filter.toLowerCase();

  const eb = document.createElement('div');
  eb.className = 'eraser-btn' + (selTile === '__erase__' ? ' active' : '');
  eb.innerHTML = `<div class="erase-ico">⌫</div><span>Eraser (E)</span>`;
  eb.onclick = () => select('__erase__', 'Eraser');
  pal.appendChild(eb);

  for (const group of GROUPS) {
    const matches = Object.entries(TILES).filter(([id, t]) =>
      t.group === group && (!fl || t.label.toLowerCase().includes(fl) || id.includes(fl)));
    if (!matches.length) continue;

    const gt = document.createElement('div'); gt.className = 'grp-title'; gt.textContent = group;
    pal.appendChild(gt);
    const grp = document.createElement('div'); grp.className = 'grp';

    for (const [id, t] of matches) {
      const btn = document.createElement('div');
      btn.className = 'tile-btn' + (selTile === id ? ' active' : '');

      const sw = document.createElement('div'); sw.id = 'sw-' + id;
      const cvs = swatchCvs[id] || makeSwatchCanvas(id);
      swatchCvs[id] = cvs;
      sw.appendChild(cvs);

      const lbl = document.createElement('span'); lbl.textContent = t.label;
      btn.appendChild(sw); btn.appendChild(lbl);
      btn.onclick = () => select(id, t.label);
      grp.appendChild(btn);
    }
    pal.appendChild(grp);
  }
}

function select(id, lbl) {
  selTile = id; selLabel = lbl || id;
  document.getElementById('h-tile').textContent = selLabel;
  buildPalette(document.getElementById('srch').value);
}

document.getElementById('srch').addEventListener('input', e => buildPalette(e.target.value));

// ══════════════════════════════════════════════════
//  TOOLBAR
// ══════════════════════════════════════════════════
document.getElementById('b-undo').onclick = () => {
  const a = undoStack.pop(); if (!a) return;
  a.prev === null ? grid.delete(a.key) : grid.set(a.key, a.prev);
  document.getElementById('h-count').textContent = grid.size; render();
};
document.getElementById('b-clear').onclick = () => {
  if (!confirm('Clear entire map?')) return;
  undoStack.length = 0; grid.clear(); document.getElementById('h-count').textContent = 0; render();
};
document.getElementById('b-save').onclick = () => {
  const d = { version: 4, cols: COLS, rows: ROWS, tiles: Object.fromEntries(grid) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = 'learnventure_map.json'; a.click();
  URL.revokeObjectURL(url); toast('✅ Map saved!');
};
document.getElementById('b-load').onclick = () => document.getElementById('fi').click();
document.getElementById('fi').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  new FileReader().onload = ev => {
    try {
      const d = JSON.parse(ev.target.result); grid.clear();
      Object.entries(d.tiles).forEach(([k, v]) => grid.set(k, v));
      document.getElementById('h-count').textContent = grid.size;
      render(); toast('📂 Map loaded!');
    } catch { alert('Invalid map file.'); }
  }, new FileReader().readAsText(f); // workaround
  const r2 = new FileReader();
  r2.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result); grid.clear();
      Object.entries(d.tiles).forEach(([k, v]) => grid.set(k, v));
      document.getElementById('h-count').textContent = grid.size;
      render(); toast('📂 Map loaded!');
    } catch { alert('Invalid map file.'); }
  };
  r2.readAsText(f); e.target.value = '';
};
document.getElementById('zi').onclick = () => { zoom = Math.min(6, zoom * 1.18); document.getElementById('h-zoom').textContent = Math.round(zoom * 100) + '%'; render(); };
document.getElementById('zo').onclick = () => { zoom = Math.max(0.15, zoom / 1.18); document.getElementById('h-zoom').textContent = Math.round(zoom * 100) + '%'; render(); };
document.getElementById('zr').onclick = () => { zoom = 0.9; panX = 120; panY = 60; document.getElementById('h-zoom').textContent = '90%'; render(); };

window.addEventListener('keydown', e => {
  if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('b-undo').click(); }
  if ((e.key === 's' || e.key === 'S') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('b-save').click(); }
  if (e.key === 'e' || e.key === 'E') select('__erase__', 'Eraser');
});

function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
preload();
buildPalette();
select('hex_water_deep', 'Deep Ocean');
resize();
</script>
</body>
