<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learnventure — Hex Map Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080c14; font-family: 'Outfit', sans-serif; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-bottom: 1px solid #334155; flex-shrink: 0; }
  header h1 { font-size: 18px; font-weight: 800; color: #f8fafc; }
  header span { font-size: 12px; color: #94a3b8; }
  .header-btns { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn { padding: 7px 16px; border-radius: 8px; border: none; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn-ghost { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
  .btn-ghost:hover { background: #334155; }
  .btn-success { background: #22c55e; color: white; }
  .btn-success:hover { background: #16a34a; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .palette { width: 215px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .palette-search { padding: 10px; border-bottom: 1px solid #1e293b; }
  .palette-search input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-family: 'Outfit', sans-serif; font-size: 12px; outline: none; }
  .palette-sections { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 10px; }
  .palette-group-title { font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.8px; text-transform: uppercase; padding: 4px 4px 2px; }
  .palette-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .tile-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; border-radius: 8px; border: 2px solid transparent; background: #1e293b; cursor: pointer; transition: all 0.15s; user-select: none; }
  .tile-btn:hover { background: #293548; border-color: #475569; }
  .tile-btn.active { border-color: #3b82f6; background: #172554; }
  /* Preview shows image clipped to hex shape */
  .tile-preview { width: 72px; height: 62px; position: relative; overflow: hidden; }
  .tile-preview canvas { display: block; }
  .tile-btn span { font-size: 9px; color: #94a3b8; text-align: center; line-height: 1.2; }
  .tile-btn.active span { color: #93c5fd; }
  .tile-btn.eraser { grid-column: span 2; flex-direction: row; justify-content: center; gap: 8px; padding: 8px; }
  .erase-icon { width: 36px; height: 36px; background: #ef4444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .canvas-wrap { flex: 1; position: relative; overflow: hidden; }
  canvas#map-canvas { display: block; cursor: crosshair; }
  .hud { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(8,12,20,0.88); border: 1px solid #334155; border-radius: 12px; padding: 8px 16px; backdrop-filter: blur(8px); white-space: nowrap; }
  .hud-item { font-size: 11px; color: #94a3b8; }
  .hud-item strong { color: #e2e8f0; }
  .zoom-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
  .zoom-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #334155; background: rgba(15,23,42,0.9); color: #e2e8f0; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .zoom-btn:hover { background: #1e293b; }
  .kb-hint { position: absolute; top: 12px; left: 12px; background: rgba(8,12,20,0.82); border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font-size: 10px; color: #64748b; line-height: 1.8; }
  .kb-hint strong { color: #94a3b8; }
  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #22c55e; color: white; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; pointer-events: none; opacity: 0; transition: all 0.3s; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div>
    <h1>🗺️ Learnventure — Hex Map Editor</h1>
    <span>Paint · Scroll to zoom · Right-click drag to pan</span>
  </div>
  <div class="header-btns">
    <button class="btn btn-ghost" id="btn-undo">↩ Undo</button>
    <button class="btn btn-ghost" id="btn-clear">🗑 Clear</button>
    <button class="btn btn-ghost" id="btn-load">📂 Load</button>
    <button class="btn btn-success" id="btn-save">💾 Save</button>
    <input type="file" id="file-input" accept=".json" style="display:none">
  </div>
</header>
<div class="main">
  <div class="palette">
    <div class="palette-search">
      <input id="search-input" type="text" placeholder="🔍 Filter tiles..." />
    </div>
    <div class="palette-sections" id="palette-sections"></div>
  </div>
  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="map-canvas"></canvas>
    <div class="kb-hint">
      <strong>E</strong> — Eraser<br>
      <strong>Ctrl+Z</strong> — Undo<br>
      <strong>Right drag</strong> — Pan<br>
      <strong>Scroll</strong> — Zoom
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="btn-zoom-in">+</button>
      <button class="zoom-btn" id="btn-zoom-out">−</button>
      <button class="zoom-btn" id="btn-zoom-reset" style="font-size:11px;">⌖</button>
    </div>
    <div class="hud">
      <div class="hud-item">Brush: <strong id="hud-tile">Deep Ocean</strong></div>
      <div class="hud-item">Grid: <strong id="hud-coord">—</strong></div>
      <div class="hud-item">Cells: <strong id="hud-count">0</strong></div>
      <div class="hud-item">Zoom: <strong id="hud-zoom">100%</strong></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
// ═══════════════════════════════════════════════
// TILE REGISTRY
// ═══════════════════════════════════════════════
const TILE_GROUPS = [
  { name: '🌊 Water', tiles: [
    { id: 'hex_water_deep',    label: 'Deep Ocean',    src: 'assets/hex/hex_water_deep.jpg' },
    { id: 'hex_water_shallow', label: 'Shallow Coast', src: 'assets/hex/hex_water_shallow.jpg' },
  ]},
  { name: '🪨 Coastal Cliff', tiles: [
    { id: 'hex_cliff_rock',    label: 'Granite Cliff', src: 'assets/hex/hex_cliff_rock.jpg' },
    { id: 'hex_cliff_coastal', label: 'Stone Edge',    src: 'assets/hex/hex_cliff_coastal.jpg' },
  ]},
  { name: '📐 Math Realm', tiles: [
    { id: 'hex_math_slate',   label: 'Slate Stone', src: 'assets/hex/hex_math_slate.jpg' },
    { id: 'hex_math_crystal', label: 'Cyan Quartz', src: 'assets/hex/hex_math_crystal.jpg' },
    { id: 'hex_math_cobble',  label: 'Cobblestone', src: 'assets/hex/hex_math_cobble.jpg' },
  ]},
  { name: '🧪 Chemistry Realm', tiles: [
    { id: 'hex_chem_basalt', label: 'Basalt',     src: 'assets/hex/hex_chem_basalt.jpg' },
    { id: 'hex_chem_ember',  label: 'Ember Rock', src: 'assets/hex/hex_chem_ember.jpg' },
    { id: 'hex_chem_olive',  label: 'Olive Rock', src: 'assets/hex/hex_chem_olive.jpg' },
  ]},
  { name: '🌿 Biology Realm', tiles: [
    { id: 'hex_bio_moss',   label: 'Forest Moss', src: 'assets/hex/hex_bio_moss.jpg' },
    { id: 'hex_bio_spore',  label: 'Spore Stone', src: 'assets/hex/hex_bio_spore.jpg' },
    { id: 'hex_bio_timber', label: 'Timber',      src: 'assets/hex/hex_bio_timber.jpg' },
  ]},
  { name: '⚡ Physics Realm', tiles: [
    { id: 'hex_phys_steel',    label: 'Steel Plate', src: 'assets/hex/hex_phys_steel.jpg' },
    { id: 'hex_phys_circuit',  label: 'Circuit',     src: 'assets/hex/hex_phys_circuit.jpg' },
    { id: 'hex_phys_obsidian', label: 'Obsidian',    src: 'assets/hex/hex_phys_obsidian.jpg' },
  ]},
  { name: '🏪 Shop Area', tiles: [
    { id: 'hex_shop_plaza',  label: 'Limestone',   src: 'assets/hex/hex_shop_plaza.jpg' },
    { id: 'hex_shop_timber', label: 'Oak Wood',    src: 'assets/hex/hex_shop_timber.jpg' },
    { id: 'hex_shop_brick',  label: 'Terracotta',  src: 'assets/hex/hex_shop_brick.jpg' },
    { id: 'hex_shop_marble', label: 'Gold Marble', src: 'assets/hex/hex_shop_marble.jpg' },
  ]},
];

// ═══════════════════════════════════════════════
// HEX GRID GEOMETRY — pointy-top hexagons
//   Each hex cell at (col, row):
//     cx = col * dx + (row%2) * (dx/2)
//     cy = row * dy
//   where dx = sqrt(3)*R, dy = 1.5*R
// ═══════════════════════════════════════════════
const BASE_R = 52;          // circumradius at zoom=1
const SQ3    = Math.sqrt(3);

function hexDims(zoom) {
  const R  = BASE_R * zoom;
  const dx = SQ3 * R;
  const dy = 1.5 * R;
  return { R, dx, dy };
}

// Returns screen-space center of grid cell (col,row)
function cellCenter(col, row, panX, panY, zoom) {
  const { R, dx, dy } = hexDims(zoom);
  const sx = col * dx + (row & 1) * (dx / 2) + panX;
  const sy = row * dy + panY;
  return { sx, sy };
}

// Returns 6 screen-space vertices of a pointy-top hex centred at (sx,sy) with circumradius R
function hexVerts(sx, sy, R) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i + 30);  // pointy-top: 30°,90°,150°,210°,270°,330°
    pts.push({ x: sx + R * Math.cos(a), y: sy + R * Math.sin(a) });
  }
  return pts;
}

// Clip ctx to a hex polygon path
function clipHex(ctx, sx, sy, R) {
  const v = hexVerts(sx, sy, R);
  ctx.beginPath();
  ctx.moveTo(v[0].x, v[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(v[i].x, v[i].y);
  ctx.closePath();
  ctx.clip();
}

// Stroke hex outline
function strokeHex(ctx, sx, sy, R, color, lw) {
  const v = hexVerts(sx, sy, R);
  ctx.beginPath();
  ctx.moveTo(v[0].x, v[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(v[i].x, v[i].y);
  ctx.closePath();
  ctx.strokeStyle = color;
  ctx.lineWidth   = lw;
  ctx.stroke();
}

// Nearest grid cell to a screen point
function screenToCell(sx, sy, panX, panY, zoom) {
  // Inverse: approximate then refine
  const { R, dx, dy } = hexDims(zoom);
  const approxRow = Math.round((sy - panY) / dy);
  const approxCol = Math.round((sx - panX - (approxRow & 1) * dx / 2) / dx);
  let best = Infinity, bC = approxCol, bR = approxRow;
  for (let dr = -2; dr <= 2; dr++) {
    for (let dc = -2; dc <= 2; dc++) {
      const c = approxCol + dc, r = approxRow + dr;
      const { sx: cx, sy: cy } = cellCenter(c, r, panX, panY, zoom);
      const d = Math.hypot(sx - cx, sy - cy);
      if (d < best) { best = d; bC = c; bR = r; }
    }
  }
  return { col: bC, row: bR };
}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const COLS = 48, ROWS = 34;
let zoom = 0.9, panX = 200, panY = 80;
let selectedTile  = 'hex_water_deep';
let selectedLabel = 'Deep Ocean';
let isPainting    = false;
let isPanning     = false;
let panStart      = { x: 0, y: 0 };
const undoStack   = [];
const grid        = new Map();

const tileImages = {};
let loadedCount = 0, totalImages = 0;

// ═══════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════
const wrap   = document.getElementById('canvas-wrap');
const canvas = document.getElementById('map-canvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  render();
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════
function drawCell(col, row, tileId) {
  const { R } = hexDims(zoom);
  const { sx, sy } = cellCenter(col, row, panX, panY, zoom);

  // Cull off-screen
  if (sx + R * 2 < 0 || sx - R * 2 > canvas.width ||
      sy + R * 2 < 0 || sy - R * 2 > canvas.height) return;

  const img = tileImages[tileId];

  ctx.save();

  // 1. Clip to hex polygon — this creates perfect interlocking, no white BG
  clipHex(ctx, sx, sy, R);

  // 2. Draw tile image scaled and positioned so the TOP FACE fills the hex
  //    Our images are 1024x1024 with the hex top face occupying roughly
  //    the upper 58% of the image (the rest is the 3D depth side).
  //    We scale the image so its width (≈ 2R) fills the hex, then shift
  //    upward to center the top face inside the clipped hex.
  if (img && img.complete && img.naturalWidth > 0) {
    const iw = R * 2.55;   // slightly wider than hex to fill edge-to-edge
    const ih = iw;
    const ix = sx - iw / 2;
    const iy = sy - ih * 0.68;  // shift up so top face aligns with hex centre
    ctx.drawImage(img, ix, iy, iw, ih);
  } else {
    // Fallback solid colour
    ctx.fillStyle = '#1e293b';
    ctx.fill();
  }

  ctx.restore();

  // 3. Subtle hex border drawn OUTSIDE clip so it sits on top
  strokeHex(ctx, sx, sy, R, 'rgba(0,0,0,0.28)', Math.max(0.8, zoom));
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Faint grid dots for empty cells
  const { R, dx, dy } = hexDims(zoom);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const { sx, sy } = cellCenter(c, r, panX, panY, zoom);
      if (sx < -R || sx > canvas.width + R || sy < -R || sy > canvas.height + R) continue;
      ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Draw all painted tiles — row by row so upper rows always render first
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tid = grid.get(`${c},${r}`);
      if (tid) drawCell(c, r, tid);
    }
  }

  // Loading overlay
  if (loadedCount < totalImages) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 16px Outfit'; ctx.textAlign = 'center';
    ctx.fillText(`Loading tiles… ${loadedCount} / ${totalImages}`, canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'left';
  }
}

// ═══════════════════════════════════════════════
// IMAGE PRELOAD
// ═══════════════════════════════════════════════
function preload() {
  const all = TILE_GROUPS.flatMap(g => g.tiles);
  totalImages = all.length;
  for (const t of all) {
    const img = new Image();
    img.onload  = () => { loadedCount++; buildPalettePreview(t.id); render(); };
    img.onerror = () => { loadedCount++; };
    img.src = t.src;
    tileImages[t.id] = img;
  }
}

// ═══════════════════════════════════════════════
// PALETTE HEX PREVIEW (64×56 canvas clipped to hex)
// ═══════════════════════════════════════════════
const previewCanvases = {};

function renderPreviewCanvas(tileId) {
  const cvs = previewCanvases[tileId];
  if (!cvs) return;
  const pc  = cvs.getContext('2d');
  const W   = cvs.width, H = cvs.height;
  const cx  = W / 2, cy = H / 2;
  const R   = Math.min(W, H) / 2 - 1;

  pc.clearRect(0, 0, W, H);

  pc.save();
  // Clip to pointy-top hex
  pc.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i + 30);
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    if (i === 0) pc.moveTo(x, y); else pc.lineTo(x, y);
  }
  pc.closePath();
  pc.clip();

  const img = tileImages[tileId];
  if (img && img.complete && img.naturalWidth > 0) {
    const iw = R * 2.55;
    const ih = iw;
    pc.drawImage(img, cx - iw / 2, cy - ih * 0.68, iw, ih);
  } else {
    pc.fillStyle = '#1e293b';
    pc.fill();
  }
  pc.restore();

  // Border
  pc.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i + 30);
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    if (i === 0) pc.moveTo(x, y); else pc.lineTo(x, y);
  }
  pc.closePath();
  pc.strokeStyle = 'rgba(0,0,0,0.5)';
  pc.lineWidth = 1.5;
  pc.stroke();
}

function buildPalettePreview(tileId) {
  const cvs = previewCanvases[tileId];
  if (cvs) renderPreviewCanvas(tileId);
}

// ═══════════════════════════════════════════════
// PAINTING
// ═══════════════════════════════════════════════
function getXY(e) {
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return { px: src.clientX - rect.left, py: src.clientY - rect.top };
}

function paint(e) {
  if (!isPainting) return;
  const { px, py } = getXY(e);
  const { col, row } = screenToCell(px, py, panX, panY, zoom);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  const key  = `${col},${row}`;
  const prev = grid.get(key);

  if (selectedTile === '__erase__') {
    if (prev !== undefined) {
      undoStack.push({ key, prev, next: null });
      grid.delete(key);
      document.getElementById('hud-count').textContent = grid.size;
      render();
    }
  } else if (prev !== selectedTile) {
    undoStack.push({ key, prev: prev || null, next: selectedTile });
    grid.set(key, selectedTile);
    document.getElementById('hud-coord').textContent  = `${col}, ${row}`;
    document.getElementById('hud-count').textContent  = grid.size;
    render();
  }
}

// ═══════════════════════════════════════════════
// INPUT EVENTS
// ═══════════════════════════════════════════════
canvas.addEventListener('mousedown', e => {
  if (e.button === 2 || e.button === 1) {
    isPanning = true;
    panStart  = { x: e.clientX - panX, y: e.clientY - panY };
    canvas.style.cursor = 'grabbing';
    e.preventDefault(); return;
  }
  isPainting = true; paint(e);
});
canvas.addEventListener('mousemove', e => {
  if (isPanning) { panX = e.clientX - panStart.x; panY = e.clientY - panStart.y; render(); return; }
  if (isPainting) { paint(e); return; }
  const rect = canvas.getBoundingClientRect();
  const { col, row } = screenToCell(e.clientX - rect.left, e.clientY - rect.top, panX, panY, zoom);
  document.getElementById('hud-coord').textContent = `${col}, ${row}`;
});
canvas.addEventListener('mouseup',    () => { isPainting = false; isPanning = false; canvas.style.cursor = 'crosshair'; });
canvas.addEventListener('mouseleave', () => { isPainting = false; isPanning = false; canvas.style.cursor = 'crosshair'; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const d  = e.deltaY > 0 ? 0.88 : 1.14;
  const nz = Math.max(0.18, Math.min(5.0, zoom * d));
  panX = mx - (mx - panX) * (nz / zoom);
  panY = my - (my - panY) * (nz / zoom);
  zoom = nz;
  document.getElementById('hud-zoom').textContent = Math.round(zoom * 100) + '%';
  render();
}, { passive: false });

canvas.addEventListener('touchstart', e => { isPainting = true; paint(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove',  e => { paint(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend',   () => { isPainting = false; });

// ═══════════════════════════════════════════════
// PALETTE UI
// ═══════════════════════════════════════════════
function buildPalette(filter = '') {
  const sections = document.getElementById('palette-sections');
  sections.innerHTML = '';
  const fl = filter.toLowerCase();

  // Eraser
  const eb = document.createElement('div');
  eb.className = 'tile-btn eraser' + (selectedTile === '__erase__' ? ' active' : '');
  eb.innerHTML = `<div class="erase-icon">⌫</div><span style="font-size:12px;color:#f87171">Eraser (E)</span>`;
  eb.addEventListener('click', () => selectTile('__erase__', 'Eraser'));
  sections.appendChild(eb);

  for (const group of TILE_GROUPS) {
    const matches = group.tiles.filter(t => !fl || t.label.toLowerCase().includes(fl) || t.id.includes(fl));
    if (!matches.length) continue;
    const title = document.createElement('div');
    title.className = 'palette-group-title';
    title.textContent = group.name;
    sections.appendChild(title);
    const grp = document.createElement('div');
    grp.className = 'palette-group';
    for (const t of matches) {
      const btn = document.createElement('div');
      btn.className = 'tile-btn' + (selectedTile === t.id ? ' active' : '');

      // Hex-clipped preview canvas
      const previewDiv = document.createElement('div');
      previewDiv.className = 'tile-preview';
      let cvs = previewCanvases[t.id];
      if (!cvs) {
        cvs = document.createElement('canvas');
        cvs.width = 72; cvs.height = 62;
        previewCanvases[t.id] = cvs;
        renderPreviewCanvas(t.id);
      }
      previewDiv.appendChild(cvs);

      const lbl = document.createElement('span');
      lbl.textContent = t.label;
      btn.appendChild(previewDiv);
      btn.appendChild(lbl);
      btn.addEventListener('click', () => selectTile(t.id, t.label));
      grp.appendChild(btn);
    }
    sections.appendChild(grp);
  }
}

function selectTile(id, label) {
  selectedTile  = id;
  selectedLabel = label || id;
  document.getElementById('hud-tile').textContent = selectedLabel;
  buildPalette(document.getElementById('search-input').value);
}

document.getElementById('search-input').addEventListener('input', e => buildPalette(e.target.value));

// ═══════════════════════════════════════════════
// TOOLBAR BUTTONS
// ═══════════════════════════════════════════════
document.getElementById('btn-undo').addEventListener('click', () => {
  const a = undoStack.pop(); if (!a) return;
  if (a.prev === null) grid.delete(a.key); else grid.set(a.key, a.prev);
  document.getElementById('hud-count').textContent = grid.size;
  render();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('Clear the entire map?')) return;
  undoStack.length = 0; grid.clear();
  document.getElementById('hud-count').textContent = 0;
  render();
});

document.getElementById('btn-save').addEventListener('click', () => {
  const data = { version: 2, cols: COLS, rows: ROWS, tiles: Object.fromEntries(grid) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a'); a.href = url; a.download = 'learnventure_map.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Map saved!');
});

document.getElementById('btn-load').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      grid.clear();
      for (const [k, v] of Object.entries(data.tiles)) grid.set(k, v);
      document.getElementById('hud-count').textContent = grid.size;
      render(); showToast('📂 Map loaded!');
    } catch { alert('Invalid map file.'); }
  };
  reader.readAsText(file); e.target.value = '';
});

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  zoom = Math.min(5.0, zoom * 1.2);
  document.getElementById('hud-zoom').textContent = Math.round(zoom * 100) + '%'; render();
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  zoom = Math.max(0.18, zoom / 1.2);
  document.getElementById('hud-zoom').textContent = Math.round(zoom * 100) + '%'; render();
});
document.getElementById('btn-zoom-reset').addEventListener('click', () => {
  zoom = 0.9; panX = 200; panY = 80;
  document.getElementById('hud-zoom').textContent = '90%'; render();
});

window.addEventListener('keydown', e => {
  if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('btn-undo').click(); }
  if ((e.key === 's' || e.key === 'S') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('btn-save').click(); }
  if (e.key === 'e' || e.key === 'E') selectTile('__erase__', 'Eraser');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
preload();
buildPalette();
selectTile('hex_water_deep', 'Deep Ocean');
resize();
</script>
</body>
</html>
