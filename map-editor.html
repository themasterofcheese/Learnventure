<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learnventure — Hex Map Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080c14; font-family: 'Outfit', sans-serif; color: #e2e8f0;
         display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px;
           background: linear-gradient(135deg,#0f172a,#1e293b);
           border-bottom: 1px solid #334155; flex-shrink: 0; }
  header h1 { font-size: 17px; font-weight: 800; color: #f8fafc; }
  header p  { font-size: 11px; color: #64748b; }
  .header-btns { margin-left: auto; display: flex; gap: 8px; }
  .btn { padding: 7px 15px; border-radius: 8px; border: none;
         font-family: 'Outfit',sans-serif; font-size: 13px; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .btn:hover { transform: translateY(-1px); }
  .btn-ghost   { background:#1e293b; border:1px solid #334155; color:#cbd5e1; }
  .btn-ghost:hover { background:#334155; }
  .btn-success { background:#22c55e; color:white; }
  .btn-success:hover { background:#16a34a; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .palette { width: 205px; background: #0f172a; border-right: 1px solid #1e293b;
             display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .pal-search { padding: 9px; border-bottom: 1px solid #1e293b; }
  .pal-search input { width:100%; padding:6px 10px; border-radius:8px;
                      border:1px solid #334155; background:#1e293b; color:#e2e8f0;
                      font-family:'Outfit',sans-serif; font-size:12px; outline:none; }
  .pal-body { overflow-y: auto; flex:1; padding:8px;
              display: flex; flex-direction: column; gap: 8px; }
  .grp-title { font-size:10px; font-weight:700; color:#64748b;
               letter-spacing:.8px; text-transform:uppercase; padding:2px 4px; }
  .grp { display: grid; grid-template-columns: repeat(2,1fr); gap: 5px; }
  .tile-btn { display:flex; flex-direction:column; align-items:center; gap:3px;
              padding:5px; border-radius:8px; border:2px solid transparent;
              background:#1e293b; cursor:pointer; transition:all .13s; }
  .tile-btn:hover  { background:#293548; border-color:#475569; }
  .tile-btn.active { border-color:#3b82f6; background:#172554; }
  .tile-btn canvas { display:block; border-radius:4px; }
  .tile-btn span   { font-size:9px; color:#94a3b8; text-align:center; line-height:1.2; }
  .tile-btn.active span { color:#93c5fd; }
  .eraser-btn { grid-column:span 2; display:flex; align-items:center;
                justify-content:center; gap:8px; padding:8px; border-radius:8px;
                border:2px solid transparent; background:#1e293b; cursor:pointer; transition:all .13s; }
  .eraser-btn:hover  { border-color:#7f1d1d; background:#2e1a1a; }
  .eraser-btn.active { border-color:#ef4444; background:#2e1a1a; }
  .erase-ico { width:32px;height:32px; background:#ef4444; border-radius:7px;
               display:flex; align-items:center; justify-content:center; font-size:17px; }
  .eraser-btn span { font-size:12px; color:#fca5a5; font-weight:600; }
  .canvas-wrap { flex:1; position:relative; overflow:hidden; }
  canvas#mc { display:block; cursor:crosshair; }
  .hud { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
         display:flex; gap:14px; background:rgba(6,9,16,.9); border:1px solid #334155;
         border-radius:12px; padding:7px 16px; backdrop-filter:blur(10px); white-space:nowrap; }
  .hud-item { font-size:11px; color:#64748b; }
  .hud-item strong { color:#e2e8f0; font-weight:600; }
  .zc { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:4px; }
  .zb { width:30px;height:30px; border-radius:7px; border:1px solid #334155;
        background:rgba(15,23,42,.92); color:#e2e8f0; font-size:17px; cursor:pointer;
        display:flex; align-items:center; justify-content:center; transition:background .13s; }
  .zb:hover { background:#1e293b; }
  .keys { position:absolute; top:12px; left:12px; background:rgba(6,9,16,.85);
          border:1px solid #1e293b; border-radius:8px; padding:8px 12px;
          font-size:10px; color:#475569; line-height:1.9; pointer-events:none; }
  .keys strong { color:#64748b; }
  #toast { position:fixed; bottom:72px; left:50%; transform:translateX(-50%) translateY(14px);
           background:#22c55e; color:white; padding:9px 20px; border-radius:10px;
           font-size:13px; font-weight:600; pointer-events:none; opacity:0;
           transition:all .28s; z-index:999; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #proc-banner { position:fixed; bottom:0; left:0; right:0; background:#1e3a5f;
                 border-top:1px solid #3b82f6; color:#93c5fd; font-size:12px;
                 padding:6px 18px; text-align:center; display:none; }
</style>

<body>
<header>
  <div><h1>🗺️ Learnventure — Hex Map Editor</h1>
       <p>Select a tile · click/drag to paint · right-click drag to pan · scroll to zoom</p></div>
  <div class="header-btns">

<div class="main">

</div>
<div id="proc-banner">⚙️ Processing tile textures… <span id="proc-n">0</span> / <span id="proc-t">20</span></div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  TILE REGISTRY
// ═══════════════════════════════════════════════════
const TILES = {
  hex_water_deep:    { label:'Deep Ocean',   group:'🌊 Water',          src:'assets/hex/hex_water_deep.jpg',    top:'#1a5f9e', side:'#0a2d52', dark:'#051828' },
  hex_water_shallow: { label:'Shallow Coast',group:'🌊 Water',          src:'assets/hex/hex_water_shallow.jpg', top:'#2590d0', side:'#0e5a80', dark:'#063040' },
  hex_cliff_rock:    { label:'Granite Cliff',group:'🪨 Coastal Cliff',  src:'assets/hex/hex_cliff_rock.jpg',    top:'#6a7482', side:'#363e48', dark:'#1c2028' },
  hex_cliff_coastal: { label:'Stone Edge',   group:'🪨 Coastal Cliff',  src:'assets/hex/hex_cliff_coastal.jpg', top:'#b09070', side:'#6a5038', dark:'#3a2818' },
  hex_math_slate:    { label:'Slate Stone',  group:'📐 Math Realm',     src:'assets/hex/hex_math_slate.jpg',    top:'#5878b0', side:'#2e4068', dark:'#101828' },
  hex_math_crystal:  { label:'Cyan Quartz',  group:'📐 Math Realm',     src:'assets/hex/hex_math_crystal.jpg',  top:'#3868d0', side:'#1a3870', dark:'#080e30' },
  hex_math_cobble:   { label:'Cobblestone',  group:'📐 Math Realm',     src:'assets/hex/hex_math_cobble.jpg',   top:'#6888c8', side:'#384870', dark:'#181e38' },
  hex_chem_basalt:   { label:'Basalt',        group:'🧪 Chemistry Realm',src:'assets/hex/hex_chem_basalt.jpg',   top:'#4a4a58', side:'#242430', dark:'#0e0e14' },
  hex_chem_ember:    { label:'Ember Rock',   group:'🧪 Chemistry Realm',src:'assets/hex/hex_chem_ember.jpg',    top:'#c04830', side:'#6a2010', dark:'#300a04' },
  hex_chem_olive:    { label:'Olive Rock',   group:'🧪 Chemistry Realm',src:'assets/hex/hex_chem_olive.jpg',    top:'#607840', side:'#303c18', dark:'#141808' },
  hex_bio_moss:      { label:'Forest Moss',  group:'🌿 Biology Realm',  src:'assets/hex/hex_bio_moss.jpg',      top:'#5a9030', side:'#2c4818', dark:'#0e1c06' },
  hex_bio_spore:     { label:'Spore Stone',  group:'🌿 Biology Realm',  src:'assets/hex/hex_bio_spore.jpg',     top:'#306848', side:'#143020', dark:'#060e08' },
  hex_bio_timber:    { label:'Timber',        group:'🌿 Biology Realm',  src:'assets/hex/hex_bio_timber.jpg',    top:'#9a6040', side:'#4a2818', dark:'#1e0e06' },
  hex_phys_steel:    { label:'Steel Plate',  group:'⚡ Physics Realm',  src:'assets/hex/hex_phys_steel.jpg',    top:'#607898', side:'#303c50', dark:'#101820' },
  hex_phys_circuit:  { label:'Circuit',       group:'⚡ Physics Realm',  src:'assets/hex/hex_phys_circuit.jpg',  top:'#7040c8', side:'#381870', dark:'#100828' },
  hex_phys_obsidian: { label:'Obsidian',      group:'⚡ Physics Realm',  src:'assets/hex/hex_phys_obsidian.jpg', top:'#303038', side:'#181820', dark:'#08080c' },
  hex_shop_plaza:    { label:'Limestone',     group:'🏪 Shop Area',      src:'assets/hex/hex_shop_plaza.jpg',    top:'#e8c858', side:'#987828', dark:'#583c08' },
  hex_shop_timber:   { label:'Oak Wood',      group:'🏪 Shop Area',      src:'assets/hex/hex_shop_timber.jpg',   top:'#b87040', side:'#603010', dark:'#301808' },
  hex_shop_brick:    { label:'Terracotta',    group:'🏪 Shop Area',      src:'assets/hex/hex_shop_brick.jpg',    top:'#d85840', side:'#882010', dark:'#400c04' },
  hex_shop_marble:   { label:'Gold Marble',  group:'🏪 Shop Area',      src:'assets/hex/hex_shop_marble.jpg',   top:'#f0e0a0', side:'#c09840', dark:'#886820' },
};
const GROUPS = [...new Set(Object.values(TILES).map(t=>t.group))];

// ═══════════════════════════════════════════════════
//  HEX GEOMETRY  (Redblobgames flat-top offset layout)
//
//  Flat-top hex with circumradius R:
//    width  (tip to tip)  = 2*R
//    height (flat to flat) = sqrt(3)*R
//    col spacing = 1.5 * R
//    row spacing = sqrt(3) * R     (odd cols shifted down by sqrt(3)*R/2)
//
//  Vertices at angles: 0, 60, 120, 180, 240, 300 degrees
//  v0=right, v1=lower-right, v2=lower-left, v3=left, v4=upper-left, v5=upper-right
//
//  Painter's algorithm: render cols left→right, rows top→bottom.
//
//  3D effect (from Redblobgames hex-3d.js):
//    Draw SIDE FACES as trapezoid quads on the front-facing edges
//    (lower-right and lower-left edges: v0→v1 and v1→v2).
//    Then draw the TOP FACE polygon on top.
// ═══════════════════════════════════════════════════
const BASE_R = 50;
const SQ3 = Math.sqrt(3);

// Flat-top hex cell centre
function cellCentre(col, row, panX, panY, zoom) {
  const R = BASE_R * zoom;
  const x = col * 1.5 * R + panX;
  const y = row * SQ3 * R + (col % 2) * SQ3 * R / 2 + panY;
  return { sx: x, sy: y };
}

// 6 vertices of a flat-top hex centered at (sx,sy) with circumradius R
function hexVerts(sx, sy, R) {
  const v = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i;            // 0°,60°,120°,180°,240°,300°
    v.push({ x: sx + R * Math.cos(a), y: sy + R * Math.sin(a) });
  }
  return v;
  // v0=right, v1=lower-right, v2=lower-left,
  // v3=left,  v4=upper-left,  v5=upper-right
}

function hexPath(ctx, sx, sy, R) {
  const v = hexVerts(sx, sy, R);
  ctx.beginPath();
  ctx.moveTo(v[0].x, v[0].y);
  for (let i = 1; i < 6; i++) ctx.lineTo(v[i].x, v[i].y);
  ctx.closePath();
}

// Nearest hex cell to screen point (px,py)
function nearestCell(px, py, panX, panY, zoom) {
  const R = BASE_R * zoom;
  // Approx column & row from pixel coords
  const col = Math.round((px - panX) / (1.5 * R));
  // Search 3×3 neighbourhood
  let best = Infinity, bc = col, br = 0;
  for (let dc = -2; dc <= 2; dc++) {
    for (let dr = -2; dr <= 2; dr++) {
      const c = col + dc;
      const { sx, sy } = cellCentre(c, Math.round((py - panY - (c % 2) * SQ3 * R / 2) / (SQ3 * R)) + dr, panX, panY, zoom);
      const d = Math.hypot(px - sx, py - sy);
      if (d < best) {
        best = d;
        bc = c;
        br = Math.round((py - panY - (c % 2) * SQ3 * R / 2) / (SQ3 * R)) + dr;
      }
    }
  }
  return { col: bc, row: br };
}

// ═══════════════════════════════════════════════════
//  IMAGE LOADING + WHITE REMOVAL
//  Strip near-white low-saturation background pixels (alpha → 0)
//  so we can use tile images as polygon fill textures cleanly.
// ═══════════════════════════════════════════════════
const rawImgs   = {};   // original Image objects
const cleanCvs  = {};   // offscreen canvas, white removed
const swatchCvs = {};
let loadedN = 0, processedN = 0;
const totalN = Object.keys(TILES).length;

function processImage(tid) {
  const img = rawImgs[tid];
  if (!img || !img.complete || !img.naturalWidth) return;

  // Work at reduced resolution for speed — 384px is sufficient for pattern fidelity
  const SZ = 384;
  const off = document.createElement('canvas');
  off.width = off.height = SZ;
  const pc = off.getContext('2d', { willReadFrequently: true });
  pc.drawImage(img, 0, 0, SZ, SZ);

  const id = pc.getImageData(0, 0, SZ, SZ);
  const d  = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const mx = Math.max(r, g, b), sat = mx - Math.min(r, g, b);
    // Near-white = very bright AND near-neutral (low saturation)
    if (mx > 225 && sat < 30) { d[i+3] = 0; }
  }
  pc.putImageData(id, 0, 0);
  cleanCvs[tid] = off;

  processedN++;
  document.getElementById('proc-n').textContent = processedN;
  if (processedN >= totalN) {
    document.getElementById('proc-banner').style.display = 'none';
  }
  refreshSwatch(tid);
  render();
}

function preload() {
  document.getElementById('proc-banner').style.display = 'block';
  document.getElementById('proc-t').textContent = totalN;
  for (const [id, t] of Object.entries(TILES)) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { loadedN++; processImage(id); };
    img.onerror = () => { loadedN++; processedN++;
      document.getElementById('proc-n').textContent = processedN;
      if (processedN >= totalN) document.getElementById('proc-banner').style.display='none';
    };
    img.src = t.src;
    rawImgs[id] = img;
  }
}

// ═══════════════════════════════════════════════════
//  DRAW ONE 3D HEX TILE  (Redblobgames hex-3d method)
//
//  Based on https://www.redblobgames.com/x/2326-hex-3d/
//  "Another way to make hexagons 3D is to keep the tops flat,
//   and then draw sides on them."
//
//  Step 1 – Side faces (drawn FIRST, behind the top):
//    Front-left  side: quad v1, v2, (v2 drop), (v1 drop)
//    Front-right side: quad v0, v1, (v1 drop), (v0 drop)
//
//  Step 2 – Top face: the plain hex polygon, filled with image
//           (clipped to hex shape so nothing bleeds out).
//
//  Step 3 – Edge highlight on upper edges (v4→v5→v0) for rim light.
//  Step 4 – Thin border on full hex outline.
// ═══════════════════════════════════════════════════
function drawTile(ctx, sx, sy, R, tid) {
  const t  = TILES[tid];
  const ci = cleanCvs[tid];
  const v  = hexVerts(sx, sy, R);

  // Wall depth proportional to R (matches Dorfromantik's coin thickness)
  const depth = Math.max(3, R * 0.18);

  // ── SIDE FACES ──────────────────────────────────
  // Front-left side  (v1 → v2)
  ctx.beginPath();
  ctx.moveTo(v[1].x, v[1].y);
  ctx.lineTo(v[2].x, v[2].y);
  ctx.lineTo(v[2].x, v[2].y + depth);
  ctx.lineTo(v[1].x, v[1].y + depth);
  ctx.closePath();
  ctx.fillStyle = t.dark; ctx.fill();

  // Front-right side (v0 → v1)
  ctx.beginPath();
  ctx.moveTo(v[0].x, v[0].y);
  ctx.lineTo(v[1].x, v[1].y);
  ctx.lineTo(v[1].x, v[1].y + depth);
  ctx.lineTo(v[0].x, v[0].y + depth);
  ctx.closePath();
  ctx.fillStyle = t.side; ctx.fill();

  // Thin bottom edge of platform
  ctx.beginPath();
  ctx.moveTo(v[2].x, v[2].y + depth);
  ctx.lineTo(v[1].x, v[1].y + depth);
  ctx.lineTo(v[0].x, v[0].y + depth);
  ctx.strokeStyle = t.dark; ctx.lineWidth = 0.8; ctx.stroke();

  // ── TOP FACE ────────────────────────────────────
  // Base colour
  hexPath(ctx, sx, sy, R);
  ctx.fillStyle = t.top; ctx.fill();

  // Tile image overlay (clip to hex, drawn large enough to fully cover,
  // positioned so the visual CENTRE of the image aligns with hex centre)
  if (ci) {
    ctx.save();
    hexPath(ctx, sx, sy, R);
    ctx.clip();

    // Draw the cleaned image 2.2× bigger than the hex diameter.
    // Since white is now transparent, we see only the actual texture.
    // Position it so the centre of the image is the centre of the hex.
    const iSize = R * 2.5;
    ctx.drawImage(ci, sx - iSize / 2, sy - iSize / 2, iSize, iSize);
    ctx.restore();
  }

  // Inner vignette on top face for depth
  ctx.save();
  hexPath(ctx, sx, sy, R);
  ctx.clip();
  const vg = ctx.createRadialGradient(sx, sy, R * 0.2, sx, sy, R * 1.1);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = vg; ctx.fill();
  ctx.restore();

  // ── EDGE LIGHTING ───────────────────────────────
  const lw = Math.max(0.7, R * 0.055);

  // Bright highlight on upper-left and upper-right edges (v3→v4→v5)
  ctx.beginPath();
  ctx.moveTo(v[3].x, v[3].y);
  ctx.lineTo(v[4].x, v[4].y);
  ctx.lineTo(v[5].x, v[5].y);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = lw * 1.1; ctx.lineJoin = 'round'; ctx.stroke();

  // Medium highlight on right edge (v5→v0)
  ctx.beginPath();
  ctx.moveTo(v[5].x, v[5].y); ctx.lineTo(v[0].x, v[0].y);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = lw; ctx.stroke();

  // Shadow on lower-left and lower-right edges (v0→v1→v2→v3)
  ctx.beginPath();
  ctx.moveTo(v[0].x, v[0].y);
  ctx.lineTo(v[1].x, v[1].y);
  ctx.lineTo(v[2].x, v[2].y);
  ctx.lineTo(v[3].x, v[3].y);
  ctx.strokeStyle = 'rgba(0,0,0,0.65)';
  ctx.lineWidth = lw * 1.2; ctx.lineJoin = 'round'; ctx.stroke();

  // Thin hex outline
  hexPath(ctx, sx, sy, R);
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = Math.max(0.4, R * 0.03); ctx.stroke();
}

// ═══════════════════════════════════════════════════
//  PALETTE SWATCHES  (same technique, small scale)
// ═══════════════════════════════════════════════════
function makeSwatchCanvas(tid) {
  const W=72, H=64, cx=W/2, cy=H/2;
  const R = Math.min(W,H)/2 - 4;
  const cvs = document.createElement('canvas');
  cvs.width = W; cvs.height = H;
  const pc = cvs.getContext('2d');
  const t = TILES[tid];
  const v = hexVerts(cx, cy, R);

  const depth = Math.max(2, R * 0.18);

  // Sides
  pc.beginPath(); pc.moveTo(v[1].x,v[1].y); pc.lineTo(v[2].x,v[2].y);
  pc.lineTo(v[2].x,v[2].y+depth); pc.lineTo(v[1].x,v[1].y+depth); pc.closePath();
  pc.fillStyle = t.dark; pc.fill();

  pc.beginPath(); pc.moveTo(v[0].x,v[0].y); pc.lineTo(v[1].x,v[1].y);
  pc.lineTo(v[1].x,v[1].y+depth); pc.lineTo(v[0].x,v[0].y+depth); pc.closePath();
  pc.fillStyle = t.side; pc.fill();

  // Top: base colour
  function hp(){pc.beginPath();pc.moveTo(v[0].x,v[0].y);for(let i=1;i<6;i++)pc.lineTo(v[i].x,v[i].y);pc.closePath();}
  hp(); pc.fillStyle = t.top; pc.fill();

  // Image
  const ci = cleanCvs[tid];
  if (ci) {
    pc.save(); hp(); pc.clip();
    const iSize = R * 2.5;
    pc.drawImage(ci, cx-iSize/2, cy-iSize/2, iSize, iSize);
    pc.restore();
  }

  // Vignette
  pc.save(); hp(); pc.clip();
  const vg = pc.createRadialGradient(cx,cy,R*.2,cx,cy,R*1.1);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.38)');
  pc.fillStyle = vg; pc.fill(); pc.restore();

  // Highlights
  const lw = Math.max(0.6, R*0.055);
  pc.beginPath(); pc.moveTo(v[3].x,v[3].y); pc.lineTo(v[4].x,v[4].y); pc.lineTo(v[5].x,v[5].y);
  pc.strokeStyle='rgba(255,255,255,0.5)'; pc.lineWidth=lw*1.1; pc.lineJoin='round'; pc.stroke();
  pc.beginPath(); pc.moveTo(v[0].x,v[0].y); pc.lineTo(v[1].x,v[1].y); pc.lineTo(v[2].x,v[2].y); pc.lineTo(v[3].x,v[3].y);
  pc.strokeStyle='rgba(0,0,0,0.65)'; pc.lineWidth=lw*1.2; pc.lineJoin='round'; pc.stroke();
  hp(); pc.strokeStyle='rgba(0,0,0,0.45)'; pc.lineWidth=0.8; pc.stroke();

  return cvs;
}

function refreshSwatch(tid) {
  const cvs = makeSwatchCanvas(tid);
  swatchCvs[tid] = cvs;
  const el = document.getElementById('sw-'+tid);
  if (el) { el.innerHTML=''; el.appendChild(cvs); }
}

// ═══════════════════════════════════════════════════
//  STATE & CANVAS
// ═══════════════════════════════════════════════════
const COLS=48, ROWS=34;
let zoom=0.9, panX=120, panY=60;
let selTile='hex_water_deep', selLabel='Deep Ocean';
let isPaint=false, isPan=false, panSt={x:0,y:0};
const undoStack=[], grid=new Map();

const cw  = document.getElementById('cw');
const can = document.getElementById('mc');
const ctx = can.getContext('2d');

function resize() { can.width=cw.clientWidth; can.height=cw.clientHeight; render(); }
window.addEventListener('resize', resize);

function render() {
  ctx.clearRect(0,0,can.width,can.height);
  ctx.fillStyle='#04060e'; ctx.fillRect(0,0,can.width,can.height);

  const R = BASE_R * zoom;

  // Faint dot grid
  ctx.fillStyle='rgba(255,255,255,0.025)';
  for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) {
    const {sx,sy}=cellCentre(c,r,panX,panY,zoom);
    if (sx<-R*2||sx>can.width+R*2||sy<-R*2||sy>can.height+R*2) continue;
    ctx.beginPath(); ctx.arc(sx,sy,1.2,0,Math.PI*2); ctx.fill();
  }

  // Draw tiles — col order L→R, row order T→B (painter's algorithm for flat-top)
  for (let c=0; c<COLS; c++) for (let r=0; r<ROWS; r++) {
    const tid=grid.get(`${c},${r}`); if (!tid) continue;
    const {sx,sy}=cellCentre(c,r,panX,panY,zoom);
    if (sx+R*3<0||sx-R*3>can.width||sy+R*3<0||sy-R*3>can.height) continue;
    drawTile(ctx,sx,sy,R,tid);
  }
}

// ═══════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════
function canvasXY(e){const rc=can.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{px:s.clientX-rc.left,py:s.clientY-rc.top};}
function paint(e){
  if(!isPaint)return;
  const {px,py}=canvasXY(e);
  const {col,row}=nearestCell(px,py,panX,panY,zoom);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  const key=`${col},${row}`,prev=grid.get(key);
  if(selTile==='__erase__'){
    if(prev!==undefined){undoStack.push({key,prev,next:null});grid.delete(key);hud(col,row);render();}
  }else if(prev!==selTile){
    undoStack.push({key,prev:prev||null,next:selTile});grid.set(key,selTile);hud(col,row);render();
  }
}
function hud(c,r){document.getElementById('h-coord').textContent=`${c},${r}`;document.getElementById('h-count').textContent=grid.size;}

can.addEventListener('mousedown',e=>{
  if(e.button===2||e.button===1){isPan=true;panSt={x:e.clientX-panX,y:e.clientY-panY};can.style.cursor='grabbing';e.preventDefault();return;}
  isPaint=true;paint(e);
});
can.addEventListener('mousemove',e=>{
  if(isPan){panX=e.clientX-panSt.x;panY=e.clientY-panSt.y;render();return;}
  if(isPaint){paint(e);return;}
  const rc=can.getBoundingClientRect();
  const {col,row}=nearestCell(e.clientX-rc.left,e.clientY-rc.top,panX,panY,zoom);
  document.getElementById('h-coord').textContent=`${col},${row}`;
});
can.addEventListener('mouseup',()=>{isPaint=false;isPan=false;can.style.cursor='crosshair';});
can.addEventListener('mouseleave',()=>{isPaint=false;isPan=false;can.style.cursor='crosshair';});
can.addEventListener('contextmenu',e=>e.preventDefault());
can.addEventListener('wheel',e=>{
  e.preventDefault();
  const rc=can.getBoundingClientRect(),mx=e.clientX-rc.left,my=e.clientY-rc.top;
  const d=e.deltaY>0?.88:1.14,nz=Math.max(.15,Math.min(6,zoom*d));
  panX=mx-(mx-panX)*(nz/zoom);panY=my-(my-panY)*(nz/zoom);zoom=nz;
  document.getElementById('h-zoom').textContent=Math.round(zoom*100)+'%';render();
},{passive:false});
can.addEventListener('touchstart',e=>{isPaint=true;paint(e);e.preventDefault();},{passive:false});
can.addEventListener('touchmove',e=>{paint(e);e.preventDefault();},{passive:false});
can.addEventListener('touchend',()=>{isPaint=false;});

// ═══════════════════════════════════════════════════
//  PALETTE UI
// ═══════════════════════════════════════════════════
function buildPalette(filter=''){
  const pal=document.getElementById('pal');
  pal.innerHTML='';
  const fl=filter.toLowerCase();

  const eb=document.createElement('div');
  eb.className='eraser-btn'+(selTile==='__erase__'?' active':'');
  eb.innerHTML=`<div class="erase-ico">⌫</div><span>Eraser (E)</span>`;
  eb.onclick=()=>select('__erase__','Eraser');
  pal.appendChild(eb);

  for(const group of GROUPS){
    const matches=Object.entries(TILES).filter(([id,t])=>t.group===group&&(!fl||t.label.toLowerCase().includes(fl)));
    if(!matches.length)continue;
    const gt=document.createElement('div');gt.className='grp-title';gt.textContent=group;pal.appendChild(gt);
    const grp=document.createElement('div');grp.className='grp';
    for(const[id,t]of matches){
      const btn=document.createElement('div');
      btn.className='tile-btn'+(selTile===id?' active':'');
      const sw=document.createElement('div');sw.id='sw-'+id;
      sw.appendChild(swatchCvs[id]||makeSwatchCanvas(id));
      const lbl=document.createElement('span');lbl.textContent=t.label;
      btn.appendChild(sw);btn.appendChild(lbl);
      btn.onclick=()=>select(id,t.label);
      grp.appendChild(btn);
    }
    pal.appendChild(grp);
  }
}

function select(id,lbl){selTile=id;selLabel=lbl||id;document.getElementById('h-tile').textContent=selLabel;buildPalette(document.getElementById('srch').value);}
document.getElementById('srch').addEventListener('input',e=>buildPalette(e.target.value));

// ═══════════════════════════════════════════════════
//  TOOLBAR
// ═══════════════════════════════════════════════════
document.getElementById('b-undo').onclick=()=>{
  const a=undoStack.pop();if(!a)return;
  a.prev===null?grid.delete(a.key):grid.set(a.key,a.prev);
  document.getElementById('h-count').textContent=grid.size;render();
};
document.getElementById('b-clear').onclick=()=>{
  if(!confirm('Clear entire map?'))return;
  undoStack.length=0;grid.clear();document.getElementById('h-count').textContent=0;render();
};
document.getElementById('b-save').onclick=()=>{
  const d={version:6,cols:COLS,rows:ROWS,tiles:Object.fromEntries(grid)};
  const url=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='learnventure_map.json';a.click();
  URL.revokeObjectURL(url);toast('✅ Map saved!');
};
document.getElementById('b-load').onclick=()=>document.getElementById('fi').click();
document.getElementById('fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);grid.clear();Object.entries(d.tiles).forEach(([k,v])=>grid.set(k,v));document.getElementById('h-count').textContent=grid.size;render();toast('📂 Map loaded!');}catch{alert('Invalid map file.');}};
  r.readAsText(f);e.target.value='';
};
document.getElementById('zi').onclick=()=>{zoom=Math.min(6,zoom*1.18);document.getElementById('h-zoom').textContent=Math.round(zoom*100)+'%';render();};
document.getElementById('zo').onclick=()=>{zoom=Math.max(.15,zoom/1.18);document.getElementById('h-zoom').textContent=Math.round(zoom*100)+'%';render();};
document.getElementById('zr').onclick=()=>{zoom=.9;panX=120;panY=60;document.getElementById('h-zoom').textContent='90%';render();};

window.addEventListener('keydown',e=>{
  if((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)){e.preventDefault();document.getElementById('b-undo').click();}
  if((e.key==='s'||e.key==='S')&&(e.ctrlKey||e.metaKey)){e.preventDefault();document.getElementById('b-save').click();}
  if(e.key==='e'||e.key==='E')select('__erase__','Eraser');
});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
buildPalette();
select('hex_water_deep','Deep Ocean');
preload();
resize();
</script>
